networks:
  shared-net:
    external: true
services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: always
    networks:
      - shared-net
    secrets:
      - db-password
    depends_on:
      redis:
        condition: service_started
    volumes:
      - db-data:/var/lib/mysql
      - type: bind
        source: /home/vitalitenb/dash-files3
        target: /dash-files
    environment:
      - MYSQL_DATABASE=OCA
      - MYSQL_USER=usr
      - MYSQL_PASSWORD=usrpass
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
      - MYSQL_ROOT_HOST=%
      - REDIS_URL=redis://redis:6379/0
    ports:
      - 8091:8091
  
  cronjobs:
    build:
      context: ./cronjobs
      dockerfile: Dockerfile
    restart: always
    secrets:
      - db-password
    networks:
      - shared-net
    volumes:
      - db-data:/var/lib/mysql
      - type: bind
        source: /home/vitalitenb/dash-files3
        target: /dash-files
    environment:
      - MYSQL_DATABASE=OCA
      - MYSQL_USER=usr
      - MYSQL_PASSWORD=usrpass
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
      - MYSQL_ROOT_HOST=%
      - TFAPI_IP_ADDR=${TFAPI_IP_ADDR:-10.111.243.18}
      - TFAPI_SAMPLE_PREFIX=${TFAPI_SAMPLE_PREFIX:-HD}
      - TFAPI_LOOKBACK_DAYS=${TFAPI_LOOKBACK_DAYS:-2}
      - TFAPI_AUTH_TOKEN=${TFAPI_AUTH_TOKEN:-}
      - TFAPI_AUTH_TOKEN_FILE=${TFAPI_AUTH_TOKEN_FILE:-/dash-files/tfapi_auth_token.txt}

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    networks:
      - shared-net
    volumes:
      - redis-data:/data
    ports:
      - 6380:6379

volumes:
  db-data:
    external: true
    name: oca_db-data
  redis-data:
  #comments:
  #exclusions:

#networks:
#  host:
#    name: host

secrets:
  db-password:
    file: db/password.txt
