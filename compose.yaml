services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: always
    secrets:
      - db-password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - db-data:/var/lib/mysql
      - type: bind
        source: /Volumes/gth5TExt1/VS/IARC/HGDB/dash-files
        target: /dash-files
    environment:
      - MYSQL_DATABASE=vardb
      - MYSQL_USER=usr
      - MYSQL_PASSWORD=usrpass
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
      - MYSQL_ROOT_HOST=%
      - REDIS_URL=redis://redis:6379/0
    ports:
      - 8090:8090
  
  cronjobs:
    build:
      context: ./cronjobs
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/mysql
      - type: bind
        source: /Volumes/gth5TExt1/VS/IARC/HGDB/dash-files
        target: /dash-files
    environment:
      - MYSQL_DATABASE=vardb
      - MYSQL_USER=usr
      - MYSQL_PASSWORD=usrpass
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
      - MYSQL_ROOT_HOST=%

  db:
    image: mysql/mysql-server
    command: '--default-authentication-plugin=mysql_native_password'
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --password="$$(cat /run/secrets/db-password)" --silent']
      interval: 3s
      retries: 5
      start_period: 30s
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/mysql
      - ./schema:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_DATABASE=vardb
      - MYSQL_USER=usr
      - MYSQL_PASSWORD=usrpass
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
      - MYSQL_ROOT_HOST=%
    expose:
      - 3309
    ports:
      - 3309:3309

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - 6380:6379

volumes:
  db-data:
  redis-data:
  #comments:
  #exclusions:

#networks:
#  host:
#    name: host

secrets:
  db-password:
    file: db/password.txt
